version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mm_chatbot_db
    environment:
      POSTGRES_DB: mm_chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mm_chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mm_chatbot_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/mm_chatbot
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.5-flash-lite
      - EMBEDDING_PROVIDER=gemini
      - EMBEDDING_MODEL=gemini-embedding-001
      - EMBEDDING_DIM=3072
      - SEARCH_PROVIDER=duckduckgo
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mm_chatbot_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:

